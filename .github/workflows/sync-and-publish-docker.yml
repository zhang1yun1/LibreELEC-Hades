name: Sync Upstream & Publish Docker Hub Images

on:
  schedule:
    - cron: '25 */2 * * *' # 每 2 小时自动检查一次上游更新与 Release
  workflow_dispatch:
    inputs:
      force_userland:
        description: '强制重新构建并推送用户态镜像 (latest)'
        required: false
        default: false
        type: boolean
      force_kernel:
        description: '强制重新编译并推送定制内核镜像 (kernel)'
        required: false
        default: false
        type: boolean
      repack_kernel:
        description: '仅更新内核安装器脚本/飞牛模块并重新打包推送 :kernel (无需重编内核)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  UPSTREAM_REPO: "flhs0606/LibreELEC-Hades"
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME || 'aguan' }}/libreelec-hades-dv
  BASELINE_KERNEL_HASH: "f663b381ac6c196788866d4b87ec44a2d5f8e31f7a54666cf128f0ceefe06ffa"

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    outputs:
      need_userland: ${{ steps.detect.outputs.need_userland }}
      release_tag: ${{ steps.detect.outputs.release_tag }}
      asset_url: ${{ steps.detect.outputs.asset_url }}
      need_kernel: ${{ steps.detect.outputs.need_kernel }}
      need_repack_kernel: ${{ steps.detect.outputs.need_repack_kernel }}
      kernel_hash: ${{ steps.detect.outputs.kernel_hash }}
      remote_kernel_ver: ${{ steps.detect.outputs.remote_kernel_ver }}
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Fork with Upstream (Rebase-Safe Overlay)
        run: |
          # 备份当前分支的 .github/workflows 与 docker-hades 脚本
          mkdir -p /tmp/custom-overlay/.github/workflows /tmp/custom-overlay/docker-hades
          cp -rf .github/workflows/* /tmp/custom-overlay/.github/workflows/
          cp -rf docker-hades/* /tmp/custom-overlay/docker-hades/

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git"
          git fetch upstream main

          # 对齐到上游最新 main 并叠加自动化脚本
          git checkout -B main upstream/main
          rm -rf .github/workflows
          mkdir -p .github/workflows docker-hades
          cp -rf /tmp/custom-overlay/.github/workflows/* .github/workflows/
          cp -rf /tmp/custom-overlay/docker-hades/* docker-hades/
          chmod +x docker-hades/*.sh docker-hades/*.py

          git add -A .github/workflows docker-hades
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): overlay Docker Hub auto-build workflow onto upstream/main"
          fi
          git push --force origin main || echo "::warning::Fork branch push skipped (workflow permission); downstream jobs will sync upstream/main directly"

      - name: Detect Upstream Release & Kernel Patch Changes
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update && sudo apt-get install -y skopeo jq

          # 1. 查询上游最新有效 Release (包含 LibreELEC-Generic.x86_64-*.tar 或 .img.gz)
          RELEASE_JSON=$(gh api "repos/${{ env.UPSTREAM_REPO }}/releases")
          RELEASE_TAG=$(echo "$RELEASE_JSON" | jq -r '
            map(select(.draft == false and (.tag_name | startswith("untagged-") | not)))
            | map(select(any(.assets[]; (.name | test("^LibreELEC-Generic\\.x86_64-.*\\.(tar|img\\.gz)$")))))
            | .[0].tag_name // empty
          ')
          ASSET_URL=$(echo "$RELEASE_JSON" | jq -r --arg TAG "$RELEASE_TAG" '
            .[] | select(.tag_name == $TAG)
            | (.assets | map(select(.name | endswith(".tar"))) + map(select(.name | endswith(".img.gz"))))[0].browser_download_url // empty
          ')

          echo "Upstream Latest Release Tag: ${RELEASE_TAG}"
          echo "Upstream Asset URL: ${ASSET_URL}"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "asset_url=${ASSET_URL}" >> "$GITHUB_OUTPUT"

          # 读取 Docker Hub 当前 latest 镜像记录的版本标签
          CURRENT_USERLAND_VER=$(skopeo inspect "docker://docker.io/${DOCKERHUB_REPO}:latest" 2>/dev/null | jq -r '.Labels["org.opencontainers.image.version"] // empty' || true)
          echo "Current Docker Hub Userland Version: ${CURRENT_USERLAND_VER:-<none>}"

          if [[ "${{ inputs.force_userland }}" == "true" ]] || [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "$CURRENT_USERLAND_VER" ]]; then
            echo ">>> 检测到用户态新版本或手动强制触发，准备构建推送用户态镜像"
            echo "need_userland=true" >> "$GITHUB_OUTPUT"
          else
            echo ">>> 用户态镜像已是最新版本 (${CURRENT_USERLAND_VER})，跳过构建"
            echo "need_userland=false" >> "$GITHUB_OUTPUT"
          fi

          # 2. 计算当前上游内核补丁树指纹
          KERNEL_HASH=$(find packages/linux/package.mk packages/linux/patches/default projects/Generic/patches/linux projects/Generic/linux -type f | sort | xargs sha256sum | sha256sum | awk '{print $1}')
          echo "Current Upstream Kernel Patch Hash: ${KERNEL_HASH}"
          echo "kernel_hash=${KERNEL_HASH}" >> "$GITHUB_OUTPUT"

          REMOTE_KERNEL_INFO=$(skopeo inspect "docker://docker.io/${DOCKERHUB_REPO}:kernel" 2>/dev/null || echo "{}")
          REMOTE_KERNEL_HASH=$(echo "$REMOTE_KERNEL_INFO" | jq -r '.Labels["io.kodi-dv.kernel-hash"] // empty')
          REMOTE_KERNEL_VER=$(echo "$REMOTE_KERNEL_INFO" | jq -r '.Labels["org.opencontainers.image.version"] // empty')
          REMOTE_INSTALLER_REV=$(echo "$REMOTE_KERNEL_INFO" | jq -r '.Labels["io.kodi-dv.installer-rev"] // empty')
          REMOTE_FNOS_HASH=$(echo "$REMOTE_KERNEL_INFO" | jq -r '.Labels["io.kodi-dv.fnos-hash"] // empty')
          LOCAL_INSTALLER_REV=$(sha256sum docker-hades/build-kernel-installer.py | cut -c1-16)
          LOCAL_FNOS_HASH=$( (cd docker-hades && LC_ALL=C sha256sum fnos-*-dv-modules.tar.gz 2>/dev/null | LC_ALL=C sort -k2) | sha256sum | awk '{print $1}' )
          echo "Docker Hub Kernel Version: ${REMOTE_KERNEL_VER:-<none>}, Hash: ${REMOTE_KERNEL_HASH:-<none>}, InstallerRev: ${REMOTE_INSTALLER_REV:-<none>} (Local: ${LOCAL_INSTALLER_REV}), FnosHash: ${REMOTE_FNOS_HASH:-<none>} (Local: ${LOCAL_FNOS_HASH})"
          echo "remote_kernel_ver=${REMOTE_KERNEL_VER:-7.3.1-20261112}" >> "$GITHUB_OUTPUT"

          if [[ "${{ inputs.force_kernel }}" == "true" ]]; then
            echo ">>> 手动强制触发内核重编"
            echo "need_kernel=true" >> "$GITHUB_OUTPUT"
            echo "need_repack_kernel=false" >> "$GITHUB_OUTPUT"
          elif [[ "$KERNEL_HASH" == "$REMOTE_KERNEL_HASH" ]] || [[ ( -z "$REMOTE_KERNEL_HASH" || "$REMOTE_KERNEL_HASH" == "8ed4131907" ) && "$KERNEL_HASH" == "$BASELINE_KERNEL_HASH" ]]; then
            echo ">>> 上游内核补丁未发生变动，跳过内核编译"
            echo "need_kernel=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ inputs.repack_kernel }}" == "true" ]] || [[ "$LOCAL_INSTALLER_REV" != "$REMOTE_INSTALLER_REV" ]] || [[ "$LOCAL_FNOS_HASH" != "$REMOTE_FNOS_HASH" ]]; then
              echo ">>> 检测到内核安装器脚本/飞牛模块更新，准备快速重新打包推送 :kernel 镜像"
              echo "need_repack_kernel=true" >> "$GITHUB_OUTPUT"
            else
              echo ">>> 安装器脚本与飞牛模块均为最新，跳过 :kernel 打包"
              echo "need_repack_kernel=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo ">>> 检测到上游内核版本或补丁更新，准备编译新内核"
            echo "need_kernel=true" >> "$GITHUB_OUTPUT"
            echo "need_repack_kernel=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync FnOS Prebuilt Modules to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          TARBALLS=(docker-hades/fnos-*-dv-modules.tar.gz)
          if [[ ${#TARBALLS[@]} -eq 0 ]]; then
            echo ">>> 未发现 docker-hades/fnos-*-dv-modules.tar.gz，跳过 FnOS 模块 Release 同步。"
            exit 0
          fi

          TAG="fnos-dv-modules"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "FnOS Prebuilt Dolby Vision Driver Modules" \
              --notes "Per-kernel-version prebuilt i915 & amdgpu Dolby Vision driver modules for FnOS lossless injection (auto-downloaded on demand by the :kernel installer)."
          fi

          ASSETS_JSON=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets || echo '{"assets":[]}')
          EXISTING_ASSETS=$(echo "$ASSETS_JSON" | jq -r '.assets[].name')

          rm -rf /tmp/fnos-rel-sync && mkdir -p /tmp/fnos-rel-sync
          if echo "$EXISTING_ASSETS" | grep -qx "fnos-modules-sha256.txt"; then
            gh release download "$TAG" -p "fnos-modules-sha256.txt" -D /tmp/fnos-rel-sync --repo "${{ github.repository }}" || true
          fi

          MANIFEST_PATH="/tmp/fnos-rel-sync/fnos-modules-sha256.txt"
          touch "$MANIFEST_PATH"
          cp -f "$MANIFEST_PATH" /tmp/fnos-rel-sync/prev.txt

          declare -A SHA_MAP
          while read -r sha name; do
            name="${name#\*}"
            name="${name##*/}"
            if [[ ${#sha} -eq 64 && -n "$name" ]]; then
              SHA_MAP["$name"]="${sha,,}"
            fi
          done < "$MANIFEST_PATH"

          TO_UPLOAD=()
          for tb in "${TARBALLS[@]}"; do
            fname=$(basename "$tb")
            local_sha=$(sha256sum "$tb" | awk '{print tolower($1)}')
            if ! echo "$EXISTING_ASSETS" | grep -qx "$fname" || [[ "${SHA_MAP[$fname]:-}" != "$local_sha" ]]; then
              TO_UPLOAD+=("$tb")
            fi
            SHA_MAP["$fname"]="$local_sha"
          done

          if [[ ${#TO_UPLOAD[@]} -gt 0 ]]; then
            echo ">>> 正在同步上传 FnOS 预编译模块到 Release ($TAG): ${TO_UPLOAD[*]}"
            gh release upload "$TAG" "${TO_UPLOAD[@]}" --clobber --repo "${{ github.repository }}"
          fi

          : > /tmp/fnos-rel-sync/new.txt
          for k in $(printf '%s\n' "${!SHA_MAP[@]}" | LC_ALL=C sort); do
            printf '%s  %s\n' "${SHA_MAP[$k]}" "$k" >> /tmp/fnos-rel-sync/new.txt
          done

          if ! cmp -s /tmp/fnos-rel-sync/prev.txt /tmp/fnos-rel-sync/new.txt || ! echo "$EXISTING_ASSETS" | grep -qx "fnos-modules-sha256.txt"; then
            cp -f /tmp/fnos-rel-sync/new.txt /tmp/fnos-rel-sync/fnos-modules-sha256.txt
            gh release upload "$TAG" /tmp/fnos-rel-sync/fnos-modules-sha256.txt --clobber --repo "${{ github.repository }}"
            echo ">>> 已同步更新 FnOS 模块校验清单 fnos-modules-sha256.txt"
          else
            echo ">>> FnOS Release ($TAG) 模块与校验清单均为最新。"
          fi

      - name: Update Docker Hub Overview (README)
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "${DH_USER}" || -z "${DH_TOKEN}" ]]; then
            echo ">>> [提示] 未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN Secrets，跳过 Docker Hub Overview 同步。"
            exit 0
          fi
          JWT_TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg u "${DH_USER}" --arg p "${DH_TOKEN}" '{username: $u, password: $p}')" \
            | jq -r '.token // empty')
          if [[ -n "$JWT_TOKEN" ]]; then
            PAYLOAD=$(jq -n \
              --arg desc "LibreELEC 13 Hades (DV Profile 5/7 FEL/8.1 + HDR10+ + 3D + BD-J) container & three-mode host kernel manager" \
              --rawfile full ./docker-hades/DOCKERHUB_README.md \
              '{description: $desc, full_description: $full}')
            HTTP_CODE=$(curl -s -o /tmp/dh-resp.json -w "%{http_code}" -X PATCH \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_REPO}/" \
              -H "Authorization: JWT ${JWT_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo ">>> Docker Hub Overview 已成功自动同步更新！"
            else
              echo ">>> [提示] Docker Hub Overview 自动更新返回 HTTP ${HTTP_CODE}（如需自动更新 Overview，请将 Docker Hub Token 权限设为 Read, Write, Delete）"
            fi
          fi

  repack-kernel:
    needs: check-and-sync
    if: needs.check-and-sync.outputs.need_repack_kernel == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static skopeo

      - name: Login to Docker Hub (skopeo)
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | skopeo login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Extract Existing Kernel .deb & Repack with Updated Installer Script
        run: |
          mkdir -p /tmp/kernel-debs
          docker run --rm -v /tmp/kernel-debs:/out "docker.io/${{ env.DOCKERHUB_REPO }}:kernel" --extract
          cp -f docker-hades/fnos-*-dv-modules.tar.gz /tmp/kernel-debs/
          ls -lh /tmp/kernel-debs/

          KVER=$(ls /tmp/kernel-debs/linux-image-*-dv_*.deb | head -n 1 | sed -n 's|.*/linux-image-\([0-9.]*\)-dv_.*|\1|p')
          if [[ -z "$KVER" ]]; then
            KVER="7.3.1"
          fi

          python3 docker-hades/build-kernel-installer.py \
            --bundle-dir /tmp/kernel-debs \
            --output-tar /tmp/libreelec-hades-dv-kernel.tar \
            --kernel-ver "${KVER}-dv" \
            --pkg-ver "${{ needs.check-and-sync.outputs.remote_kernel_ver }}" \
            --kernel-hash "${{ needs.check-and-sync.outputs.kernel_hash }}" \
            --repo "${{ env.DOCKERHUB_REPO }}" \
            --github-repo "${{ github.repository }}"

          skopeo copy --retry-times 5 "docker-archive:/tmp/libreelec-hades-dv-kernel.tar" "docker://docker.io/${{ env.DOCKERHUB_REPO }}:kernel"
          skopeo copy --retry-times 5 "docker://docker.io/${{ env.DOCKERHUB_REPO }}:kernel" "docker://docker.io/${{ env.DOCKERHUB_REPO }}:kernel-${KVER}-dv"

  publish-userland:
    needs: check-and-sync
    if: needs.check-and-sync.outputs.need_userland == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SquashFS & Extraction Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools p7zip-full curl

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Userland Image
        run: |
          chmod +x docker-hades/build-userland-image.sh
          ./docker-hades/build-userland-image.sh \
            "${{ needs.check-and-sync.outputs.release_tag }}" \
            "${{ needs.check-and-sync.outputs.asset_url }}" \
            "${{ env.DOCKERHUB_REPO }}"

  publish-kernel:
    needs: check-and-sync
    if: needs.check-and-sync.outputs.need_kernel == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Latest Upstream Kernel Patches
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git"
          git fetch upstream main
          git checkout upstream/main -- packages/linux projects/Generic

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: kernel-hades-dv-ccache-${{ needs.check-and-sync.outputs.kernel_hash }}
          restore-keys: |
            kernel-hades-dv-ccache-

      - name: Install Kernel Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev libdw-dev \
            debhelper dpkg-dev rsync kmod cpio pahole lsb-release \
            ccache busybox-static skopeo xz-utils curl

      - name: Login to Docker Hub (skopeo)
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | skopeo login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Compile Kernel & Push Installer Image to Docker Hub
        run: |
          ccache -M 5G
          ccache -z
          chmod +x docker-hades/build-kernel-deb.sh docker-hades/build-kernel-installer.py
          ./docker-hades/build-kernel-deb.sh \
            "${{ needs.check-and-sync.outputs.kernel_hash }}" \
            "${{ env.DOCKERHUB_REPO }}" \
            "${{ github.repository }}"
          ccache -s

      - name: Publish Kernel .deb Packages to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="kernel-hades-dv-$(date -u +%Y%m%d)"
          if gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" /tmp/kernel-build/out/*.deb --clobber --repo "${{ github.repository }}"
          else
            gh release create "${RELEASE_TAG}" /tmp/kernel-build/out/*.deb \
              --repo "${{ github.repository }}" \
              --title "LibreELEC Hades Dolby Vision Host Kernel (${RELEASE_TAG})" \
              --notes "Auto-built Debian/Ubuntu/FnOS host kernel packages (Intel & AMD supported) synchronized from upstream ${{ env.UPSTREAM_REPO }}."
          fi
